<body>

<div id="toast-root" class="toast-root"></div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="9" fill="var(--gold)"/>
      <path d="M16 6 L24 25 L16 19.5 L8 25 Z" fill="#120b03"/>
    </svg>
    <span>PsyZero</span>
  </div>
  <nav class="topnav" id="topnav">
    <button class="nav-btn active" data-view="dashboard">Tableau de bord</button>
    <button class="nav-btn" data-view="categories">Entraînement</button>
    <button class="nav-btn" data-view="learning">Apprentissage</button>
    <button class="nav-btn" data-view="exam">Examen blanc</button>
    <button class="nav-btn" data-view="profile">Progression</button>
  </nav>
  <div class="topbar-stats">
    <div class="pill" id="sync-pill" title="État de la synchronisation">Synchronisé</div>
    <div class="pill" id="streak-pill" title="Série de jours consécutifs">🔥 0</div>
    <div class="pill" id="level-pill" title="Niveau">Nv. 1</div>
  </div>
</header>

<main id="app"></main>

<footer class="app-footer">
  PsyZero est un outil d'entraînement indépendant à la préparation des tests psychotechniques de sélection pilote de ligne (format PSY0). Non affilié à une compagnie aérienne ou école de pilotage. Données synchronisées automatiquement sur ton compte.
</footer>

<script src="js/app.js"></script>
</body>
